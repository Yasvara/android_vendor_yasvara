[workspace]
members = [
    "crates/pasang-core",
    "crates/pulih-gfx",
    "crates/pulih",
    "crates/pulih-sim",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
